name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate runtime config (fails when Supabase settings are missing)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          NG_APP_POSTHOG_PROJECT_TOKEN: ${{ vars.NG_APP_POSTHOG_PROJECT_TOKEN }}
          NG_APP_POSTHOG_HOST: ${{ vars.NG_APP_POSTHOG_HOST }}
          NG_APP_LOCK_SCREEN_ENABLED: ${{ vars.NG_APP_LOCK_SCREEN_ENABLED }}
          BUILD_ID: ${{ github.sha }}
        run: node scripts/generate-runtime-config.cjs --require-values

      - name: Build Angular app
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST }}
        run: npm run build -- --base-href /setpoint-beach-tennis/

      - name: Enable Angular route fallback on Pages
        run: cp dist/setpoint/browser/index.html dist/setpoint/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/setpoint/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
