name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate runtime config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          NG_APP_POSTHOG_PROJECT_TOKEN: ${{ vars.NG_APP_POSTHOG_PROJECT_TOKEN }}
          NG_APP_POSTHOG_HOST: ${{ vars.NG_APP_POSTHOG_HOST }}
          BUILD_ID: ${{ github.sha }}
        run: |
          node -e "const fs = require('node:fs'); fs.mkdirSync('public', { recursive: true }); fs.writeFileSync('public/runtime-config.js', 'window.__SETPOINT_CONFIG__ = ' + JSON.stringify({ supabaseUrl: process.env.SUPABASE_URL || '', publishableKey: process.env.SUPABASE_PUBLISHABLE_KEY || '', buildId: (process.env.BUILD_ID || '').slice(0, 7), production: true, ...(process.env.NG_APP_POSTHOG_PROJECT_TOKEN ? { posthogKey: process.env.NG_APP_POSTHOG_PROJECT_TOKEN } : {}), ...(process.env.NG_APP_POSTHOG_HOST ? { posthogHost: process.env.NG_APP_POSTHOG_HOST } : {}) }) + ';\\n');"

      - name: Build Angular app
        run: npm run build -- --base-href /setpoint-beach-tennis/

      - name: Enable Angular route fallback on Pages
        run: cp dist/setpoint/browser/index.html dist/setpoint/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/setpoint/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4