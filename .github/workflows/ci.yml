name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs a pull request needs. Anything that is not a pull request (the deploy on main) runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            printf 'app=true\ndb=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          printf 'Changed files:\n%s\n' "$files"
          # The app jobs (e2e, visual, lighthouse) are skipped only when every file is on this list of files that
          # cannot change what the app builds or renders. Anything else, including a file nobody listed, runs them.
          not_app='^(docs/|supabase/|tests/[^/]+\.test\.cjs$|\.github/(dependabot\.yml|pull_request_template\.md)$|[^/]+\.md$|\.env\.example$|\.editorconfig$)'
          # The database job runs when one of these changes.
          db='^(supabase/|src/app/core/adapters/supabase/database\.types\.ts$|scripts/(db-lint|check-migrations)\.cjs$|package(-lock)?\.json$|\.nvmrc$|\.github/)'
          app=false
          db_changed=false
          if grep -vqE "$not_app" <<< "$files"; then app=true; fi
          if grep -qE "$db" <<< "$files"; then db_changed=true; fi
          printf 'app=%s\ndb=%s\n' "$app" "$db_changed" | tee -a "$GITHUB_OUTPUT"

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup

      - name: Validate PR title as a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no -- commitlint

  # Always runs: formatting and lint cover docs too, and the build enforces the bundle budgets.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint TypeScript and templates
        run: npm run lint

      - name: Lint styles
        run: npm run lint:styles

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Find unused files, exports and dependencies
        run: npm run knip

      - name: Translation keys (no missing or unused keys)
        run: npm run i18n:check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Database tests (PGlite)
        run: npm run test:db

      - name: Generate runtime config (no secrets, pull request safe)
        run: node scripts/generate-runtime-config.cjs

      - name: Build with bundle budgets
        run: npm run build -- --base-href /setpoint-beach-tennis/

  # Timing metrics (TBT) vary from run to run on shared runners, so Lighthouse reports but never blocks a PR.
  # The bundle budgets in the build step above are the blocking size check.
  lighthouse:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup

      - name: Generate runtime config (no secrets, pull request safe)
        run: node scripts/generate-runtime-config.cjs

      - name: Build
        run: npm run build -- --base-href /setpoint-beach-tennis/

      - name: Lighthouse CI (production build, Supabase mocked, external hosts blocked)
        run: npm run perf:lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
          retention-days: 7

  database:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup

      - name: Start local Supabase and apply every migration from empty
        run: npm run db:start

      - name: Migration rules (forward-only, vendor-neutral)
        if: github.event_name == 'pull_request'
        run: npm run db:migrations -- origin/${{ github.base_ref }}

      - name: Lint new migrations with squawk
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD -- 'supabase/migrations/*.sql')
          if [ -n "$files" ]; then npx squawk $files; fi

      - name: Security and performance lints (splinter, supabase db lint)
        run: npm run db:lint

      - name: Permission and invariant tests (pgTAP)
        run: npm run test:db:supabase

      - name: Generated database types are up to date
        run: |
          npm run db:types
          git diff --exit-code -- src/app/core/adapters/supabase/database.types.ts

  e2e:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (no external services are reachable)
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Pixel comparisons only match inside one environment: the Playwright image the baselines are generated in
  # (npm run e2e:visual:update). The ubuntu runner renders fonts and emoji differently.
  visual:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --init --ipc=host
    timeout-minutes: 15
    env:
      E2E_VISUAL: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup

      - name: The image matches the installed Playwright version
        run: test "$(node -p "require('@playwright/test/package.json').version")" = "1.65.1"

      - name: Visual baselines
        run: npx playwright test --project visual

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The one check to require in branch protection. A job skipped by the path filter counts as passed;
  # a failed, cancelled or errored one does not. Lighthouse is advisory (continue-on-error), so it is not listed.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, pr-title, quality, database, e2e, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed or was skipped by the path filter
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
