name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate PR title as a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no -- commitlint

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint TypeScript and templates
        run: npm run lint

      - name: Lint styles
        run: npm run lint:styles

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Find unused files, exports and dependencies
        run: npm run knip

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Database tests (PGlite)
        run: npm run test:db

      - name: Generate runtime config (no secrets, pull request safe)
        run: node scripts/generate-runtime-config.cjs

      - name: Build with bundle budgets
        run: npm run build -- --base-href /setpoint-beach-tennis/

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase and apply every migration from empty
        run: npm run db:start

      - name: Migration rules (forward-only, vendor-neutral)
        if: github.event_name == 'pull_request'
        run: npm run db:migrations -- origin/${{ github.base_ref }}

      - name: Lint new migrations with squawk
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD -- 'supabase/migrations/*.sql')
          if [ -n "$files" ]; then npx squawk $files; fi

      - name: Security and performance lints (splinter, supabase db lint)
        run: npm run db:lint

      - name: Permission and invariant tests (pgTAP)
        run: npm run test:db:supabase

      - name: Generated database types are up to date
        run: |
          npm run db:types
          git diff --exit-code -- src/app/core/database.types.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (no external services are reachable)
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
